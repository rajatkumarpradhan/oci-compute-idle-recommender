[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-compute-idle-recommender"
version = "0.1.0"
description = "Offline idle/downsize recommender for OCI Compute utilization exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-compute-idle-recommender = "oci_compute_idle_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
